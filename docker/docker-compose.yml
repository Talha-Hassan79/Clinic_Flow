version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clinicflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: clinicflow
    ports:
      - '5433:5432'
    volumes:
      - clinicflow-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clinicflow-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - clinicflow-redisdata:/data

volumes:
  clinicflow-pgdata:
  clinicflow-redisdata:
